name: Check submission
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: startsWith(github.event.issue.title, '[Package]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const review = require('./scripts/review.js');
            await review.check({ github, context });
