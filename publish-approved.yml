name: Publish approved package
on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved' && startsWith(github.event.issue.title, '[Package]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const review = require('./scripts/review.js');
            await review.publish({ github, context });
